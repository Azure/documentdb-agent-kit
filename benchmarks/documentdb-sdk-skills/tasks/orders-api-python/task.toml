version = "1.0"

[metadata]
author_name = "documentdb-sdk-skills-bench"
author_email = "noreply@example.com"
difficulty = "medium"
category = "skills-compliance"
tags = ["documentdb", "mongodb", "python", "sdk-best-practices", "azure"]

[verifier]
# 900s allows: DocumentDB start (~10-30s) + build + app start + bulk filler
# load (20k docs) + ~30 pytest checks.
timeout_sec = 900.0

[agent]
# 1 hour for the agent to author 4 endpoints plus the data modelling and
# indexing decisions.
timeout_sec = 3600.0

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory = "8G"
storage = "20G"
