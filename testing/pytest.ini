[pytest]
# Discover scenario tests under scenarios/<name>/tests/
testpaths = scenarios
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q --timeout=600
norecursedirs = _* iterations batch-results
markers =
    redundancy: index-redundancy-finder.sh contract tests
    integrity: data-integrity-check.sh contract tests
    perf: perf-advisor.sh contract tests
    healthy_indexes: false-positive guard (well-indexed DB must produce zero redundancy findings)
    jsoncontract: --json output shape/validity guard for all diagnostic scripts
    kbrouter: knowledge-base router (kb_route.py) routing/scoring contract tests
    determinism: Loop A — diagnostic scripts must return identical --json across repeated runs
    tokens: Loop B cost accounting (token_usage.py) — pure arithmetic, no container needed
    remediation: before/after grading — the kit's advice must measurably improve the database
    evalsconfig: static validation of the Loop B eval + experiment configs (no container)
    benchmarkmetrics: Loop C — MSBench cost-metric harvester (no container needed)
    benchmarkconfig: Loop C — MSBench benchmark structure and registration (no container)
    routeefficiency: text-skills vs diagnostic-scripts route comparison (no container)
    advanceddata: committed ecommerce-advanced dataset generation and invariant checks
    portable: cross-platform diagnostic launcher contracts (no container)
